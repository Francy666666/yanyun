<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>问签 · 先觉菩萨寺</title>
  <meta name="description" content="深山古寺，一签一念。">
  <script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed');</script>
  <link rel="stylesheet" href="assets/问签.css">
</head>
<body>
  <main class="temple" id="问签页面">
    <header class="site-topbar" aria-label="站点导航">
      <a class="site-brand" href="motion.html#合照">
        <span class="site-brand-cn">给洗衣粉的惊喜</span>
        <span class="site-brand-en">SURPRISE</span>
      </a>
      <nav class="site-nav" aria-label="栏目">
        <a href="motion.html#合照">和师父的合照</a>
        <a class="active" href="motion.html#问签" aria-current="page">古寺问签</a>
      </nav>
      <div class="site-date" aria-hidden="true">10月25日</div>
    </header>

    <a class="back-to-main" href="问签.html#入殿层" aria-label="返回入殿">
      <span class="sword-aura" aria-hidden="true"></span>
      <svg class="sword" viewBox="0 0 200 56" aria-hidden="true">
        <defs>
          <linearGradient id="bladeIce" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5fa8d4"/>
            <stop offset=".2" stop-color="#dff8ff"/>
            <stop offset=".45" stop-color="#ffffff"/>
            <stop offset=".62" stop-color="#eafaff"/>
            <stop offset=".82" stop-color="#b9e6fa"/>
            <stop offset="1" stop-color="#4b97c6"/>
          </linearGradient>
          <linearGradient id="hiltIce" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6aaed6"/>
            <stop offset=".35" stop-color="#f4fdff"/>
            <stop offset=".7" stop-color="#c7ecfb"/>
            <stop offset="1" stop-color="#5a9fc7"/>
          </linearGradient>
          <linearGradient id="iceLine" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#6ab8e8" stop-opacity="0"/>
            <stop offset=".4" stop-color="#9cdcff" stop-opacity=".6"/>
            <stop offset="1" stop-color="#eafcff" stop-opacity=".95"/>
          </linearGradient>
          <radialGradient id="gemIce" cx=".5" cy=".4" r=".6">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset=".45" stop-color="#c8f2ff"/>
            <stop offset="1" stop-color="#4ba6d8"/>
          </radialGradient>
          <filter id="iceGlow" x="-120%" y="-120%" width="340%" height="340%">
            <feGaussianBlur stdDeviation="2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- 寒气丝带 -->
        <g class="ice-ribbons" fill="none" stroke="url(#iceLine)" stroke-width="1.3" stroke-linecap="round" filter="url(#iceGlow)">
          <path class="ice-ribbon" d="M150 28 C168 8 192 14 196 30 C199 42 184 50 170 42"/>
          <path class="ice-ribbon" d="M154 38 C172 52 194 46 196 30"/>
        </g>

        <!-- 剑身 -->
        <path class="sword-blade" d="M4 28 C46 19 98 16 146 16 L158 28 L146 40 C98 40 46 37 4 28 Z" fill="url(#bladeIce)" stroke="#dff8ff" stroke-width=".6" filter="url(#iceGlow)"/>
        <path class="sword-ridge" d="M10 28 C56 25 104 22 150 21.5" stroke="#ffffff" stroke-width=".9" opacity=".65"/>
        <path class="sword-edge" d="M6 25 C50 19 100 17 146 16.5" stroke="#9cdcff" stroke-width=".7" opacity=".8"/>

        <!-- 护手 -->
        <path class="sword-guard" d="M154 10 C164 17 166 39 154 46 C158 36 158 20 154 10 Z" fill="url(#hiltIce)" stroke="#ecfdff" stroke-width=".7" filter="url(#iceGlow)"/>
        <path class="guard-gem" d="M158 21 L164 28 L158 35 L152 28 Z" fill="url(#gemIce)" stroke="#fff" stroke-width=".6"/>

        <!-- 剑柄与剑首 -->
        <rect x="162" y="24" width="26" height="8" rx="4" fill="url(#hiltIce)"/>
        <path class="sword-wrap" d="M166 24.5 L168 31.5 M172 24.5 L174 31.5 M178 24.5 L180 31.5 M184 24.5 L186 31.5" stroke="#ffffff" stroke-width=".8" opacity=".5"/>
        <path class="sword-pommel" d="M190 23 L198 28 L190 33 L184 28 Z" fill="url(#gemIce)" stroke="#eafcff" stroke-width=".7" filter="url(#iceGlow)"/>

        <!-- 冰晶 -->
        <g class="ice-shards" fill="#dff8ff" opacity=".8" filter="url(#iceGlow)">
          <path d="M140 18 L146 10 L144 22 Z"/>
          <path d="M146 42 L152 50 L138 46 Z"/>
          <path d="M120 14 L124 6 L126 18 Z"/>
        </g>
      </svg>

      <i class="frost" style="--x:10px;--y:14px;--d:-.2s"></i>
      <i class="frost" style="--x:26px;--y:30px;--d:-1.1s"></i>
      <i class="frost" style="--x:40px;--y:12px;--d:-2.1s"></i>
      <i class="frost" style="--x:52px;--y:24px;--d:-.7s"></i>
      <i class="frost" style="--x:18px;--y:34px;--d:-1.6s"></i>
      <i class="frost" style="--x:46px;--y:34px;--d:-2.7s"></i>
      <i class="frost" style="--x:32px;--y:8px;--d:-.4s"></i>
      <i class="frost" style="--x:58px;--y:18px;--d:-1.9s"></i>
    </a>
    <div class="sky" aria-hidden="true"></div>
    <div class="moon" aria-hidden="true"></div>
    <svg class="mountains" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path class="m-far" d="M0 610 C 120 560 220 600 330 540 C 450 474 520 520 620 500 C 720 480 790 560 900 520 C 1010 480 1080 430 1200 500 C 1300 558 1380 560 1440 540 L1440 900 L0 900 Z"/>
      <path class="m-mid" d="M0 690 C 140 620 250 670 380 610 C 500 554 590 610 700 590 C 820 568 920 640 1040 600 C 1160 560 1280 620 1440 590 L1440 900 L0 900 Z"/>
      <path class="m-near" d="M0 790 C 180 720 330 770 480 720 C 640 666 760 740 900 720 C 1050 700 1200 760 1440 710 L1440 900 L0 900 Z"/>
      <g class="pagoda" transform="translate(190 466)" fill="#05090b">
        <rect x="30" y="104" width="62" height="42"/>
        <path d="M8 104 Q61 80 114 104 L104 96 Q61 72 18 96 Z"/>
        <rect x="42" y="62" width="38" height="34"/>
        <path d="M20 62 Q61 42 102 62 L94 55 Q61 36 28 55 Z"/>
        <rect x="52" y="30" width="18" height="24"/>
        <path d="M34 30 Q61 14 88 30 L82 23 Q61 10 40 23 Z"/>
        <line x1="61" y1="8" x2="61" y2="30" stroke="#05090b" stroke-width="3"/>
      </g>
    </svg>
    <div class="beam" aria-hidden="true"></div>
    <div class="mist mist-a" aria-hidden="true"></div>
    <div class="mist mist-b" aria-hidden="true"></div>
    <div class="mist mist-c" aria-hidden="true"></div>
    <div class="dust" aria-hidden="true"></div>

    <div class="plaque" aria-hidden="true"><span>莫向外求</span></div>

    <header class="sig-head">
      <p class="temple-name">先觉菩萨寺</p>
      <h1>问签</h1>
      <p class="sig-sub">一签一念 · 心诚则灵</p>
    </header>

    <div class="incense" aria-hidden="true">
      <div class="censer"></div>
      <i class="stick"></i><i class="stick"></i><i class="stick"></i>
      <div class="smoke">
        <i style="--x:-6px;--d:0s;--t:9s"></i>
        <i style="--x:5px;--d:-2s;--t:11s"></i>
        <i style="--x:-2px;--d:-4s;--t:10s"></i>
        <i style="--x:7px;--d:-6s;--t:12s"></i>
        <i style="--x:-8px;--d:-3s;--t:13s"></i>
        <i style="--x:2px;--d:-7s;--t:9.5s"></i>
        <i style="--x:-4px;--d:-5s;--t:10.5s"></i>
        <i style="--x:6px;--d:-8s;--t:12.5s"></i>
      </div>
    </div>
    <div class="lamp" aria-hidden="true"></div>

    <section class="altar" aria-label="签筒">
      <div class="tube-wrap" id="签筒区域">
        <div class="tube-shadow" aria-hidden="true"></div>
        <div class="tube" id="签筒" role="button" tabindex="0" aria-label="按住摇签，松手落签">
          <svg viewBox="0 0 200 280" aria-hidden="true">
            <defs>
              <linearGradient id="tubeGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#1a140d"/>
                <stop offset=".18" stop-color="#4a3a25"/>
                <stop offset=".42" stop-color="#7d6543"/>
                <stop offset=".62" stop-color="#5a472e"/>
                <stop offset=".84" stop-color="#332718"/>
                <stop offset="1" stop-color="#120e08"/>
              </linearGradient>
              <linearGradient id="stickGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#8d7956"/>
                <stop offset=".45" stop-color="#d8c9a4"/>
                <stop offset="1" stop-color="#796645"/>
              </linearGradient>
            </defs>

            <!-- 筒身 -->
            <path d="M32 88 C32 72 58 62 100 62 C142 62 168 72 168 88 L160 238 C158 256 136 266 100 266 C64 266 42 256 40 238 Z" fill="url(#tubeGrad)"/>
            <path d="M52 96 C50 150 48 200 47 238" stroke="#d8c9a4" stroke-width="2" opacity=".12" fill="none"/>
            <path d="M40 146 C70 155 130 155 160 146" stroke="#17120b" stroke-width="3" opacity=".5" fill="none"/>
            <path d="M42 196 C72 205 128 205 158 196" stroke="#17120b" stroke-width="3" opacity=".42" fill="none"/>

            <!-- 筒口 -->
            <ellipse cx="100" cy="86" rx="68" ry="18" fill="#0d0a06"/>
            <ellipse cx="100" cy="86" rx="68" ry="18" fill="none" stroke="#8a7350" stroke-width="4"/>

            <!-- 竹签 -->
            <g class="stick" transform="translate(58 84) rotate(-9)">
              <rect x="-3.5" y="-76" width="7" height="80" rx="3.5" fill="url(#stickGrad)"/>
              <line x1="-3" y1="-54" x2="3" y2="-54" stroke="#6b5838" stroke-width="1" opacity=".6"/>
            </g>
            <g class="stick" transform="translate(74 86) rotate(-4)">
              <rect x="-3.5" y="-66" width="7" height="70" rx="3.5" fill="url(#stickGrad)"/>
              <line x1="-3" y1="-44" x2="3" y2="-44" stroke="#6b5838" stroke-width="1" opacity=".6"/>
            </g>
            <g class="stick" transform="translate(90 88) rotate(-1)">
              <rect x="-3.5" y="-88" width="7" height="92" rx="3.5" fill="url(#stickGrad)"/>
              <line x1="-3" y1="-62" x2="3" y2="-62" stroke="#6b5838" stroke-width="1" opacity=".6"/>
            </g>
            <g class="stick" transform="translate(106 88) rotate(3)">
              <rect x="-3.5" y="-60" width="7" height="64" rx="3.5" fill="url(#stickGrad)"/>
            </g>
            <g class="stick" transform="translate(122 86) rotate(7)">
              <rect x="-3.5" y="-80" width="7" height="84" rx="3.5" fill="url(#stickGrad)"/>
              <line x1="-3" y1="-58" x2="3" y2="-58" stroke="#6b5838" stroke-width="1" opacity=".6"/>
            </g>
            <g class="stick" transform="translate(138 84) rotate(10)">
              <rect x="-3.5" y="-70" width="7" height="74" rx="3.5" fill="url(#stickGrad)"/>
            </g>
            <g class="stick" transform="translate(150 82) rotate(14)">
              <rect x="-3" y="-56" width="6" height="60" rx="3" fill="url(#stickGrad)"/>
            </g>

            <!-- 红绳与纸签 -->
            <path d="M38 124 C64 136 136 136 162 124" stroke="#a33127" stroke-width="3" fill="none" opacity=".8"/>
            <g transform="translate(63 172) rotate(-3)">
              <rect width="74" height="38" rx="2" fill="#e9e3d5" opacity=".9"/>
              <rect x="4" y="4" width="66" height="30" fill="none" stroke="#a33127" stroke-width=".8" opacity=".5"/>
              <text x="37" y="27" text-anchor="middle" font-size="21" fill="#1a1712" font-family="serif">问</text>
            </g>
          </svg>
        </div>
        <p class="tube-hint" id="提示">按住摇签，松手落签</p>
      </div>
    </section>

    <div class="table" aria-hidden="true"></div>

    <p class="whisper" id="默念">心里想一件事，不必说出口</p>

    <section class="jiao-stage" id="掷筊区" aria-live="polite" hidden>
      <p class="jiao-name">掷 筊</p>
      <div class="jiao-pair" id="筊杯">
        <div class="jiao" data-face="curved">
          <svg viewBox="0 0 100 64" aria-hidden="true">
            <g class="face-curved"><path d="M8 46 C12 20 34 8 50 8 C66 8 88 20 92 46 C72 32 28 32 8 46 Z" fill="#8f2d24"/><path d="M8 46 C28 32 72 32 92 46" stroke="#c25a4a" stroke-width="1.5" fill="none" opacity=".55"/></g>
            <g class="face-flat"><ellipse cx="50" cy="34" rx="44" ry="18" fill="#7c241d"/><ellipse cx="44" cy="28" rx="22" ry="8" fill="#a33127" opacity=".55"/></g>
          </svg>
        </div>
        <div class="jiao" data-face="curved">
          <svg viewBox="0 0 100 64" aria-hidden="true">
            <g class="face-curved"><path d="M8 46 C12 20 34 8 50 8 C66 8 88 20 92 46 C72 32 28 32 8 46 Z" fill="#8f2d24"/><path d="M8 46 C28 32 72 32 92 46" stroke="#c25a4a" stroke-width="1.5" fill="none" opacity=".55"/></g>
            <g class="face-flat"><ellipse cx="50" cy="34" rx="44" ry="18" fill="#7c241d"/><ellipse cx="44" cy="28" rx="22" ry="8" fill="#a33127" opacity=".55"/></g>
          </svg>
        </div>
      </div>
      <button class="jiao-btn" id="掷筊">掷 筊</button>
      <p class="jiao-hint" id="掷筊提示">问菩萨：此签可解否</p>
      <p class="jiao-result" id="掷筊结果"></p>
    </section>

    <section class="card-panel" id="签牌区域" aria-live="polite" hidden>
      <div class="scroll-paper">
        <button class="close-card" id="收起签牌" aria-label="收起签牌">×</button>
        <p class="paper-head">先觉菩萨寺 · 签房</p>

        <div class="card-art-wrap">
          <div class="card-art" id="签牌图"><div class="card-fallback"></div></div>
          <div class="card-label"><strong id="牌名"></strong></div>
        </div>

        <p class="card-state" id="正逆位"></p>
        <p class="poem" id="签诗"></p>
        <p class="keywords" id="关键词"></p>
        <p class="meaning" id="牌义"></p>

        <div class="advice">
          <p><b>宜</b><span id="宜"></span></p>
          <p><b>忌</b><span id="忌"></span></p>
        </div>

        <p class="question" id="问你"></p>
        <button class="accept" id="收下此签">收下此签</button>
      </div>
    </section>

    <p class="status" id="状态" role="status"></p>
    <footer>先觉菩萨寺 · 签房　香火不替人决定，只照见心中一念</footer>

    <div class="entry" id="入殿层">
      <div class="entry-inner">
        <p class="entry-temple">先觉菩萨寺</p>
        <h2>问签</h2>
        <p class="entry-sub">深山古寺 · 一签一念</p>
        <button id="入殿">入殿上香</button>
        <p class="entry-note">一事一签　心诚则灵</p>
      </div>
    </div>
  </main>

  <script src="assets/问签数据.js"></script>
  <script src="assets/问签.js"></script>
</body>
